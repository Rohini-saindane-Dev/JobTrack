
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application | JobTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #243b64;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2dd;
            border-radius: 6px;
            font-size: 15px;
        }

        button, .back-link {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #3157c8;
            color: white;
        }

        .back-link {
            background: #e9edf5;
            color: #243b64;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add New Application</h1>
        <p>Enter the details of the job you applied for.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="company_name">Company Name</label>
            <input
                type="text"
                id="company_name"
                name="company_name"
                placeholder="e.g. IBM"
                required
            >

            <label for="job_role">Job Role</label>
            <input
                type="text"
                id="job_role"
                name="job_role"
                placeholder="e.g. Python Developer"
                required
            >

            <label for="application_date">Application Date</label>
            <input
                type="date"
                id="application_date"
                name="application_date"
                required
            >

            <label for="status">Application Status</label>
            <select id="status" name="status" required>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>
            </select>

            <button type="submit">Save Application</button>
            <a href="/" class="back-link">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
